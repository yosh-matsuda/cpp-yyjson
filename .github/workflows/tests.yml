name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - main
    tags:
    - "v*"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, windows-2025 ]
        compiler: [ { c: "clang-cl", cxx: "clang-cl" }, { c: "cl", cxx: "cl" } ]
    name: Windows - ${{ matrix.os }} - ${{ matrix.compiler.cxx }}
    runs-on: ${{ matrix.os }}

    env:
      triplet: x64-windows

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Configure VS Toolchain
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build and test
      run: |
        rm -rf "${{ github.workspace }}\build"
        cmake -B "${{ github.workspace }}\build" -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT\\scripts\\buildsystems\\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ env.triplet }} -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -G "Ninja Multi-Config"
        # cmake --build "${{ github.workspace }}\build" --config Debug --clean-first
        # ctest --test-dir "${{ github.workspace }}\build" -C Debug
        cmake --build "${{ github.workspace }}\build" --config Release --clean-first
        ctest --test-dir "${{ github.workspace }}\build" -C Release
      shell: bash

  ubuntu-build:
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - { name: "GCC 13", os: "ubuntu-24.04", install: "apt", c: "gcc-13", cxx: "g++-13", packages: "gcc-13 g++-13" }
        - { name: "GCC 14", os: "ubuntu-24.04", install: "apt", c: "gcc-14", cxx: "g++-14", packages: "gcc-14 g++-14" }
        - { name: "GCC 15", os: "ubuntu-26.04", install: "apt", c: "gcc-15", cxx: "g++-15", packages: "gcc-15 g++-15" }
        - { name: "GCC 15 (C++23)", os: "ubuntu-26.04", install: "apt", c: "gcc-15", cxx: "g++-15", packages: "gcc-15 g++-15", std: "23" }
        - { name: "GCC 16", os: "ubuntu-26.04", install: "apt", c: "gcc-16", cxx: "g++-16", packages: "gcc-16 g++-16" }
        - { name: "GCC 16 (C++26 reflection)", os: "ubuntu-26.04", install: "apt", c: "gcc-16", cxx: "g++-16", packages: "gcc-16 g++-16", std: "26", flags: "-freflection -DCPPYYJSON_TEST_REQUIRE_STD_REFLECTION" }
        - { name: "LLVM 17", os: "ubuntu-24.04", install: "brew", c: "$(brew --prefix llvm@17)/bin/clang", cxx: "$(brew --prefix llvm@17)/bin/clang++", brewpkg: "llvm@17" }
        - { name: "LLVM 18", os: "ubuntu-24.04", install: "brew", c: "$(brew --prefix llvm@18)/bin/clang", cxx: "$(brew --prefix llvm@18)/bin/clang++", brewpkg: "llvm@18" }
        - { name: "LLVM 19", os: "ubuntu-24.04", install: "brew", c: "$(brew --prefix llvm@19)/bin/clang", cxx: "$(brew --prefix llvm@19)/bin/clang++", brewpkg: "llvm@19" }
        - { name: "LLVM 20", os: "ubuntu-24.04", install: "brew", c: "$(brew --prefix llvm@20)/bin/clang", cxx: "$(brew --prefix llvm@20)/bin/clang++", brewpkg: "llvm@20" }
        - { name: "LLVM 21", os: "ubuntu-24.04", install: "brew", c: "$(brew --prefix llvm@21)/bin/clang", cxx: "$(brew --prefix llvm@21)/bin/clang++", brewpkg: "llvm@21" }
        - { name: "LLVM 22", os: "ubuntu-24.04", install: "brew", c: "$(brew --prefix llvm@22)/bin/clang", cxx: "$(brew --prefix llvm@22)/bin/clang++", brewpkg: "llvm@22" }
        - { name: "LLVM 22 (C++23)", os: "ubuntu-24.04", install: "brew", c: "$(brew --prefix llvm@22)/bin/clang", cxx: "$(brew --prefix llvm@22)/bin/clang++", brewpkg: "llvm@22", std: "23" }
    name: Ubuntu - ${{ matrix.compiler.name }}
    runs-on: ${{ matrix.compiler.os }}

    env:
      triplet: x64-linux

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install compilers
      run: |
        if [[ "${{ matrix.compiler.install }}" == "brew" ]]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update
          brew install ninja ${{ matrix.compiler.brewpkg }}
        else
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler.packages }}
        fi

    - name: Build and test
      run: |
        if [[ "${{ matrix.compiler.install }}" == "brew" ]]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi
        export CC=${{ matrix.compiler.c }} CXX=${{ matrix.compiler.cxx }}
        rm -rf ${{ github.workspace }}/build
        cmake -B ${{ github.workspace }}/build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ env.triplet }} -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -DCMAKE_CXX_STANDARD=${{ matrix.compiler.std || 20 }} "-DCMAKE_CXX_FLAGS=${{ matrix.compiler.flags }}" -G "Ninja Multi-Config"
        cmake --build ${{ github.workspace }}/build --config Debug --clean-first
        ctest --test-dir ${{ github.workspace }}/build -C Debug
        cmake --build ${{ github.workspace }}/build --config Release --clean-first
        ctest --test-dir ${{ github.workspace }}/build -C Release

  ubuntu-target-build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - { name: "GCC 14 - x86-64-v3 + AVX2", os: "ubuntu-24.04", triplet: "x64-linux", c: "gcc-14", cxx: "g++-14", packages: "gcc-14 g++-14", flags: "-march=x86-64-v3", avx2: "ON" }
        - { name: "LLVM 18 - x86-64-v3 + AVX2", os: "ubuntu-24.04", triplet: "x64-linux", c: "clang-18", cxx: "clang++-18", packages: "clang-18", flags: "-march=x86-64-v3", avx2: "ON" }
        - { name: "GCC 14 - SSSE3", os: "ubuntu-24.04", triplet: "x64-linux", c: "gcc-14", cxx: "g++-14", packages: "gcc-14 g++-14", flags: "-mssse3", avx2: "OFF" }
        - { name: "LLVM 18 - SSSE3", os: "ubuntu-24.04", triplet: "x64-linux", c: "clang-18", cxx: "clang++-18", packages: "clang-18", flags: "-mssse3", avx2: "OFF" }
        - { name: "GCC 14 - x86-64-v3 + AVX2 - ASan/UBSan", os: "ubuntu-24.04", triplet: "x64-linux", c: "gcc-14", cxx: "g++-14", packages: "gcc-14 g++-14", flags: "-march=x86-64-v3 -fsanitize=address,undefined -fno-sanitize-recover=all", avx2: "ON" }
        - { name: "GCC 14 - arm64", os: "ubuntu-24.04-arm", triplet: "arm64-linux", c: "gcc-14", cxx: "g++-14", packages: "gcc-14 g++-14", flags: "", avx2: "OFF" }
        - { name: "LLVM 18 - arm64", os: "ubuntu-24.04-arm", triplet: "arm64-linux", c: "clang-18", cxx: "clang++-18", packages: "clang-18", flags: "", avx2: "OFF" }
    name: Ubuntu - ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build ${{ matrix.config.packages }}

    - name: Install vcpkg
      run: |
        if [[ -n "$VCPKG_INSTALLATION_ROOT" ]]; then
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
        else
          # A full clone: vcpkg.json pins a builtin-baseline commit.
          git clone https://github.com/microsoft/vcpkg.git ${{ runner.temp }}/vcpkg
          ${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"
        fi

    - name: Build and test
      run: |
        export CC=${{ matrix.config.c }} CXX=${{ matrix.config.cxx }}
        rm -rf ${{ github.workspace }}/build
        cmake -B ${{ github.workspace }}/build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.config.triplet }} -DCMAKE_C_COMPILER=${{ matrix.config.c }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_C_FLAGS="${{ matrix.config.flags }}" -DCMAKE_CXX_FLAGS="${{ matrix.config.flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.config.flags }}" -DCPPYYJSON_ENABLE_AVX2=${{ matrix.config.avx2 }} -G "Ninja Multi-Config"
        cmake --build ${{ github.workspace }}/build --config Release --clean-first
        ctest --test-dir ${{ github.workspace }}/build -C Release --output-on-failure

  upstream-yyjson-build:
    strategy:
      fail-fast: false
      matrix:
        yyjson: [ "0.6.0", "0.7.0", "0.8.0", "0.9.0", "0.10.0", "0.11.1", "0.12.0", "0.13.0" ]
        compiler: [ { name: "GCC 13", c: "gcc-13", cxx: "g++-13" }, { name: "LLVM 18", c: "clang-18", cxx: "clang++-18" } ]
    name: Ubuntu - ${{ matrix.compiler.name }} - upstream yyjson ${{ matrix.yyjson }}
    runs-on: ubuntu-24.04

    env:
      triplet: x64-linux

    steps:
    - uses: actions/checkout@v4

    - name: Install yyjson
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        git clone --depth 1 --branch ${{ matrix.yyjson }} https://github.com/ibireme/yyjson.git ${{ runner.temp }}/yyjson
        cmake -S ${{ runner.temp }}/yyjson -B ${{ runner.temp }}/yyjson/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/yyjson-install
        cmake --build ${{ runner.temp }}/yyjson/build
        cmake --install ${{ runner.temp }}/yyjson/build

    - name: Build and test
      run: |
        export CC=${{ matrix.compiler.c }} CXX=${{ matrix.compiler.cxx }}
        rm -rf ${{ github.workspace }}/build
        cmake -B ${{ github.workspace }}/build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ env.triplet }} -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -DCPPYYJSON_USE_BUNDLED_YYJSON=OFF -DCMAKE_PREFIX_PATH=${{ runner.temp }}/yyjson-install -G "Ninja Multi-Config"
        cmake --build ${{ github.workspace }}/build --config Debug --clean-first
        ctest --test-dir ${{ github.workspace }}/build -C Debug
        cmake --build ${{ github.workspace }}/build --config Release --clean-first
        ctest --test-dir ${{ github.workspace }}/build -C Release

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - { name: "GCC 15", os: "macos-latest", c: "gcc-15", cxx: "g++-15", brewpkg: "gcc@15" }
        - { name: "GCC 16", os: "macos-latest", c: "gcc-16", cxx: "g++-16", brewpkg: "gcc@16" }
        - { name: "GCC 16 (C++26 reflection)", os: "macos-latest", c: "gcc-16", cxx: "g++-16", brewpkg: "gcc@16", std: "26", flags: "-freflection -DCPPYYJSON_TEST_REQUIRE_STD_REFLECTION" }
        - { name: "Clang 19", os: "macos-latest", c: "$(brew --prefix llvm@19)/bin/clang", cxx: "$(brew --prefix llvm@19)/bin/clang++", brewpkg: "llvm@19" }
        - { name: "Clang 20", os: "macos-latest", c: "$(brew --prefix llvm@20)/bin/clang", cxx: "$(brew --prefix llvm@20)/bin/clang++", brewpkg: "llvm@20" }
        - { name: "Clang 21", os: "macos-latest", c: "$(brew --prefix llvm@21)/bin/clang", cxx: "$(brew --prefix llvm@21)/bin/clang++", brewpkg: "llvm@21" }
        - { name: "Clang 22", os: "macos-latest", c: "$(brew --prefix llvm@22)/bin/clang", cxx: "$(brew --prefix llvm@22)/bin/clang++", brewpkg: "llvm@22" }
        - { name: "AppleClang16", os: "macos-14", c: "/usr/bin/clang", cxx: "/usr/bin/clang++", xcode: "/Applications/Xcode_16.2.app" }
        - { name: "AppleClang17", os: "macos-15", c: "/usr/bin/clang", cxx: "/usr/bin/clang++", xcode: "/Applications/Xcode_26.3.app" }
        - { name: "AppleClang21", os: "macos-26", c: "/usr/bin/clang", cxx: "/usr/bin/clang++", xcode: "/Applications/Xcode_26.6.app" }
    name: MacOS - ${{ matrix.compiler.name }}
    runs-on: ${{ matrix.compiler.os }}

    env:
      triplet: arm64-osx

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Select Xcode
      if: matrix.compiler.xcode != ''
      run: |
        sudo xcode-select --switch "${{ matrix.compiler.xcode }}/Contents/Developer"
        xcodebuild -version
        clang --version

    - name: Install compiler
      run: |
        brew install ninja
        if [[ -n "${{ matrix.compiler.brewpkg }}" ]]; then
          brew install ${{ matrix.compiler.brewpkg }}
        fi

    - name: Install vcpkg
      run: |
        # A full clone: vcpkg.json pins a builtin-baseline commit.
        git clone https://github.com/microsoft/vcpkg.git external/vcpkg
        ./external/vcpkg/bootstrap-vcpkg.sh

    - name: Build and test
      run: |
        export CC=${{ matrix.compiler.c }} CXX=${{ matrix.compiler.cxx }}
        rm -rf ${{ github.workspace }}/build
        cmake -B ${{ github.workspace }}/build -DCMAKE_TOOLCHAIN_FILE=./external/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ env.triplet }} -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -DCMAKE_CXX_STANDARD=${{ matrix.compiler.std || 20 }} "-DCMAKE_CXX_FLAGS=${{ matrix.compiler.flags }}" -G "Ninja Multi-Config"
        cmake --build ${{ github.workspace }}/build --config Debug --clean-first
        ctest --test-dir ${{ github.workspace }}/build -C Debug
        cmake --build ${{ github.workspace }}/build --config Release --clean-first
        ctest --test-dir ${{ github.workspace }}/build -C Release
